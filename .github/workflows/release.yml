name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgtk-3-dev libpulse-dev libasound2-dev \
            libdbus-1-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release -p quench-daemon -p quench-cli -p quench-gui
      - name: Package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p "quench-${VER}"
          cp target/release/quench-daemon target/release/quench \
             target/release/quench-gui "quench-${VER}/"
          cp README.md LICENSE docs/SAFETY.md examples/quench.toml "quench-${VER}/"
          cp packaging/quench.service packaging/sysusers.conf \
             packaging/tmpfiles.conf packaging/quench-gui.desktop \
             packaging/quench.svg "quench-${VER}/"
          tar czf "quench-${VER}-x86_64-linux.tar.gz" "quench-${VER}"
          sha256sum "quench-${VER}-x86_64-linux.tar.gz" \
            > "quench-${VER}-x86_64-linux.tar.gz.sha256"
          echo "ASSET=quench-${VER}-x86_64-linux.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_SHA=quench-${VER}-x86_64-linux.tar.gz.sha256" >> "$GITHUB_ENV"
      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET_SHA" \
            --title "Quench $GITHUB_REF_NAME" --generate-notes
